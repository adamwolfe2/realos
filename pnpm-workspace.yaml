allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': false
  core-js: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  # eslint resolver's optional native build — lint verified working without it
  unrs-resolver: false

# Keep identical to package.json pnpm.overrides (pnpm 11+ reads this file, older pnpm reads package.json).
overrides:
  'prosemirror-view@<1.42.3': '^1.42.3'
  'undici@<6.28.1': '^6.28.1'
  'undici@>=7 <7.29.1': '^7.29.1'
  'postcss@>=8 <8.5.23': '^8.5.23'
  'fast-uri@>=3 <3.1.8': '^3.1.8'
  'brace-expansion@>=5 <5.0.11': '^5.0.11'
  'browserslist@>=4 <4.28.7': '^4.28.7'
  'js-cookie@>=3 <3.0.7': '^3.0.7'
  'lodash@>=4 <4.18.1': '^4.18.1'
  'nanoid@>=3 <3.3.18': '^3.3.18'
  'picomatch@>=4 <4.0.4': '^4.0.4'
  'protobufjs@>=7 <7.6.5': '^7.6.5'
  'source-map-js@<1.2.2': '^1.2.2'
  'dompurify@>=3 <3.4.16': '^3.4.16'
  'qs@>=6 <6.16.0': '^6.16.0'
  'baseline-browser-mapping@>=2 <2.11.0': '^2.11.0'
